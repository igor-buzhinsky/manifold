# Dependencies and development tools of the Python scripts in this folder.
[project]
name = "manifold-scripts"
version = "0.1.0"
description = "Helper scripts for developing Manifold"
requires-python = ">=3.11"
dependencies = ["pillow (>=13,<14)"]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.0"

[tool.poetry.group.dev.dependencies]
black = "^26.10"
ruff = "^0.17.5"
pyrefly = "^1.4"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify and pydocstyle.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "D"]
ignore = [
    "D401",  # Summaries may describe what a function returns ("The path of ...") instead of being imperative.
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pyrefly]
project-includes = ["*.py"]
python-version = "3.11"
