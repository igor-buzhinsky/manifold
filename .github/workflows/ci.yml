# Builds the game with GCC and with Clang, with warnings as errors, and runs the unit tests; runs the `lint` target;
# and checks the Python scripts of scripts/. The runner is the Ubuntu release that README.md documents, so the
# compilers and the clang-format and clang-tidy versions match a local setup. CMake is the runner's own, which is
# newer than Ubuntu's. A pull request that changes only Markdown files doesn't run it, since nothing it checks can
# change; pushes to main always run it. Pushing a tag vX.Y.Z also runs it, and once all checks pass, the release job
# makes a draft GitHub release of that version with a Linux build of the game.
name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run that is still going for the previous one. Every other run has a
# group of its own, so each commit on main gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # Keep in sync with the install command in README.md (pipx is already on the runner).
  APT_PACKAGES: >-
    build-essential cmake ninja-build git clang-format clang-tidy pkg-config
    libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev
    libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev
    libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev

jobs:
  build-and-test:
    name: Build and test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The two compilers that README.md names, each in the version that Ubuntu 24.04 ships.
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            extra_packages: ""
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
            extra_packages: clang-18
            # Clang takes the newest GCC's libstdc++ that it finds, and the runner has GCC 14 too. This keeps it on
            # GCC 13's, which a plain Ubuntu 24.04 has.
            flags: --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CFLAGS: ${{ matrix.flags }}
      CXXFLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # No step pushes, so the token needn't stay in .git/config.
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES ${{ matrix.extra_packages }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DMANIFOLD_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  lint:
    name: Lint (clang-format, clang-tidy)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # No step pushes, so the token needn't stay in .git/config.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES
      # Configuring is enough for clang-tidy: it needs only compile_commands.json and the downloaded headers. If a
      # generated header is ever added, build it here before linting.
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Lint
        run: cmake --build build --target lint

  python:
    name: Python scripts (black, ruff, pyrefly)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # No step pushes, so the token needn't stay in .git/config.
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.12"
      - name: Install tools
        # Poetry runs on, and makes its environment with, the Python set up above, not the runner's own.
        run: pipx install --python '${{ steps.python.outputs.python-path }}' poetry && poetry install
      - name: black
        run: poetry run black --check .
      - name: ruff
        run: poetry run ruff check .
      - name: pyrefly
        run: poetry run pyrefly check

  release:
    name: Release (Linux x86_64)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, lint, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write  # To create the release.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # No step pushes: the release is created through the API.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMANIFOLD_BUILD_TESTS=OFF
      # The tag must name the version of project() in CMakeLists.txt, so that a release can't be made of a commit
      # whose version wasn't raised.
      - name: Check version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match the version $version in CMakeLists.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cmake --build build
      # The archive holds a directory of the game made by `cmake --install`: the executable, assets/, the manual and
      # the licenses. SDL3 is linked into the executable, so only the system's C and C++ libraries, OpenGL and the
      # libraries that SDL3 loads for the display and sound are needed.
      - name: Package
        id: package
        env:
          NAME: manifold-${{ steps.version.outputs.version }}-linux-x86_64
        run: |
          cmake --install build --prefix "$NAME"
          tar -czf "$NAME.tar.gz" "$NAME"
          echo "archive=$NAME.tar.gz" >> "$GITHUB_OUTPUT"
      # A draft, so that the notes can be edited and the archive tried before the release is published by hand. The
      # notes start with how to run the game, followed by the pull requests merged since the previous release.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          NOTES: >-
            A build for Linux x86_64, made on Ubuntu 24.04: it needs glibc 2.39 or newer and a GPU with OpenGL 4.1.
            Unpack it and run `manifold` in its directory. The controls are in GAME_MANUAL.md.
        run: |
          gh release create "$TAG" "$ARCHIVE" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Manifold $VERSION" --notes "$NOTES" --generate-notes
